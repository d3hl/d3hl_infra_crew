name: static

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        env:
          UV_CACHE_DIR: /tmp/uv-cache
          UV_LINK_MODE: copy
        run: uv sync --frozen

      - name: Run static baseline
        env:
          UV_CACHE_DIR: /tmp/uv-cache
          UV_LINK_MODE: copy
        run: ./init.sh
