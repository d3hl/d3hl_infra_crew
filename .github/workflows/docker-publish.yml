name: docker-publish

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/${{ github.repository_owner }}/d3hl_infra_crew

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable=${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
            type=raw,value=0.1.0,enable=${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
            type=sha
            type=ref,event=pr

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test /healthz
        run: |
          set -euo pipefail
          docker run -d --name crew-smoke -p 18000:8000 "${{ steps.build.outputs.imageid }}"
          trap 'docker rm -f crew-smoke' EXIT
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:18000/healthz; then
              break
            fi
            sleep 1
          done
          curl -sf http://127.0.0.1:18000/healthz | grep -q '"status":"ok"'
