[project]
name = "d3hl_infra_crew"
version = "0.1.0"
description = "Plan-only CrewAI infrastructure crew for d3HL homelab repos"
authors = [
    { name = "d3HL", email = "ops@example.invalid" },
]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[tools]==1.14.6",
    "pyyaml>=6.0.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
]

[project.scripts]
kickoff = "d3hl_infra_crew.main:kickoff"
run_crew = "d3hl_infra_crew.main:kickoff"
plot = "d3hl_infra_crew.main:plot"
run_with_trigger = "d3hl_infra_crew.main:run_with_trigger"
serve = "d3hl_infra_crew.api:serve"

[build-system]
requires = [
    "hatchling",
]
build-backend = "hatchling.build"

[tool.crewai]
type = "flow"
