discover_repo_state:
  description: >
    Review the provided repo state for target repo {target_repo}.

    Repo state JSON:
    {repo_state}

    Confirm the active or next feature, baseline command, current git status,
    recent commits, and any blockers. If static checks were skipped, say so
    without implying verification passed.
  expected_output: >
    A concise repo-state brief with target repo, active feature, baseline command,
    git status, recent commits summary, blockers, and verification status.
  agent: repo_state_analyst

classify_infra_request:
  description: >
    Classify this infrastructure request for target repo {target_repo}:
    {infrastructure_request}

    HCP Terraform support context:
    {hcp_terraform_context}

    Split the request into provisioning, configuration, lifecycle, DNS/tunnel,
    validation, documentation, or repo-harness scope.
  expected_output: >
    A classification brief naming the primary scope, secondary scopes, required
    inputs, and the target files the change will create or modify.
  agent: infrastructure_provisioning_agent

select_automation_path:
  description: >
    Select the automation path for the classified request.

    HCP Terraform support context:
    {hcp_terraform_context}

    Mandatory rules:
    - Use HCP Terraform for provisioning, VM creation, Proxmox resources,
      Cloudflare resources, DNS records, tunnels, and network provisioning.
    - Use Ansible for OS configuration, package installation, users, services,
      application deployment, validation, and day-2 operations.
    - Use Bash only as glue around Terraform or Ansible.
    - Do not suggest Python when a Terraform provider or Ansible module exists.
    - For Proxmox provisioning, prefer the bpg/proxmox Terraform provider over
      telmate/proxmox unless a target feature documents otherwise.
  expected_output: >
    An automation-path decision with Terraform responsibilities, Ansible
    responsibilities, Bash glue if needed, rejected Python/API-wrapper options,
    and provider/module checks the implementer must perform.
  agent: infrastructure_provisioning_agent

draft_candidate_plan:
  description: >
    Draft a candidate implementation for {infrastructure_request} in target repo
    {target_repo}.

    HCP Terraform support context:
    {hcp_terraform_context}

    Include the exact files to create or modify with their target-repo-relative
    paths and full proposed content, the expected Terraform layout, the expected
    Ansible layout, Satellite lifecycle notes, Proxmox notes, optional Cloudflare
    notes, validation commands, and rollback hints. In the Proxmox notes, name the
    bpg/proxmox provider, a pinned `required_providers` block, and variable-driven
    provider config.
  expected_output: >
    A markdown candidate plan with sections: Assumptions, Files To Write (each with
    its target-repo-relative path and full content), Candidate Terraform, Candidate
    Ansible, Satellite Lifecycle Notes, Proxmox Notes, Cloudflare Notes, Validation
    Commands, Rollback Hints, Blockers.
  agent: infrastructure_provisioning_agent

review_candidate_plan:
  description: >
    Review the candidate plan for target repo {target_repo} for correctness before
    it is applied.

    HCP Terraform support context:
    {hcp_terraform_context}

    Check for:
    - Terraform used for provisioning and Ansible used for configuration
    - bpg/proxmox provider with a pinned required_providers block for Proxmox
    - bpg/proxmox `proxmox_virtual_environment_file` using `source_file`/`source_raw`
      as nested blocks, never as a string argument (`source_file = "..."` is invalid)
    - cloud-init/user-data variables injected via `templatefile()`, never bare
      `${var}` placeholders in a file uploaded verbatim
    - no deprecated provider resources or data sources
    - Python/custom API wrappers where Terraform or Ansible should be used
    - each file to write having a clear target-repo-relative path and complete content
    - validation commands and rollback hints that match the proposed changes
  expected_output: >
    A review with pass/fail, findings, required corrections, and the confirmed list
    of files to write with their target-repo-relative paths. If the plan fails,
    provide corrected wording.
  agent: qa_contract_guardian

apply_changes:
  description: >
    Apply the reviewed plan to target repo {target_repo} for request:
    {infrastructure_request}

    Write each confirmed file into the target repo with the `write_repo_file` tool,
    using the file's target-repo-relative path and full content. Pause for human
    review and approval before writing, and incorporate any requested changes. After
    writing, summarize exactly which files were created or modified, the validation
    commands the operator should run next, rollback hints, and remaining blockers.
    Do not claim a file was written unless the tool confirmed it.
  expected_output: >
    Final markdown summary with these sections: Summary, Files Written (absolute or
    target-repo-relative paths confirmed by the write tool), Validation Commands,
    Rollback Hints, Blockers, Next Action.
  agent: infrastructure_provisioning_agent
  human_input: true
  output_file: output/infrastructure_handoff.md
